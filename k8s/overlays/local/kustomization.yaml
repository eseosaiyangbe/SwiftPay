apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: swiftpay

resources:
  - ../../base
  - secrets-db-secrets.yaml
  - infra/postgres.yaml
  - infra/redis.yaml
  - infra/rabbitmq.yaml
  - ingress-local.yaml

patches:
  - path: local-config-patch.yaml
  - path: local-env-patch.yaml
  - path: local-quota-patch.yaml
  - path: local-probe-delays-patch.yaml

labels:
  - pairs:
      cloud-provider: local
      cluster: minikube
      environment: local
    includeSelectors: true
    includeTemplates: true

images:
  - name: veeno/api-gateway
    newName: localhost:32000/api-gateway
    newTag: 5a38691
  - name: veeno/auth-service
    newName: localhost:32000/auth-service
    newTag: 5a38691
  - name: veeno/frontend
    newName: localhost:32000/frontend
    newTag: 5a38691
  - name: veeno/notification-service
    newName: localhost:32000/notification-service
    newTag: 5a38691
  - name: veeno/transaction-service
    newName: localhost:32000/transaction-service
    newTag: 5a38691
  - name: veeno/wallet-service
    newName: localhost:32000/wallet-service
    newTag: 5a38691
