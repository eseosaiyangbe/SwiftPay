apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: swiftpay
spec:
  template:
    spec:
      containers:
        - name: api-gateway
          livenessProbe:
            initialDelaySeconds: 45
          readinessProbe:
            initialDelaySeconds: 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: swiftpay
spec:
  template:
    spec:
      containers:
        - name: auth-service
          startupProbe:
            httpGet:
              path: /health
              port: 3004
            failureThreshold: 24
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            initialDelaySeconds: 60
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            initialDelaySeconds: 30
            timeoutSeconds: 5
            failureThreshold: 12
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: swiftpay
spec:
  template:
    spec:
      containers:
        - name: notification-service
          livenessProbe:
            initialDelaySeconds: 60
            timeoutSeconds: 3
          readinessProbe:
            initialDelaySeconds: 25
            timeoutSeconds: 3
            failureThreshold: 6
