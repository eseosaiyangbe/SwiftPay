name: Validate Repository

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "k8s/**"
      - "scripts/**"
      - "services/**"
      - ".yamllint.yml"
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - ".github/workflows/**"
      - "k8s/**"
      - "scripts/**"
      - "services/**"
      - ".yamllint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            services/api-gateway/package-lock.json
            services/auth-service/package-lock.json
            services/frontend/package-lock.json
            services/notification-service/package-lock.json
            services/transaction-service/package-lock.json
            services/wallet-service/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Install validation tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python -m pip install --upgrade pip
          python -m pip install yamllint

          ACTIONLINT_VERSION=1.7.7
          curl -sSL -o /tmp/actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tgz -C /tmp
          sudo install /tmp/actionlint /usr/local/bin/actionlint

      - name: Lint GitHub Actions workflows
        run: |
          set -euo pipefail
          actionlint

      - name: Lint shell scripts
        env:
          DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          shell_scripts=()
          if [ -n "${DIFF_BASE:-}" ] && git rev-parse --verify "${DIFF_BASE}^{commit}" >/dev/null 2>&1; then
            mapfile -t shell_scripts < <(git diff --name-only "${DIFF_BASE}" "${DIFF_HEAD}" -- 'scripts/*.sh' 'scripts/**/*.sh' | sort -u)
          fi
          if [ "${#shell_scripts[@]}" -eq 0 ] && [ -f scripts/smoke-dev.sh ]; then
            shell_scripts=(scripts/smoke-dev.sh)
          fi
          if [ "${#shell_scripts[@]}" -gt 0 ]; then
            shellcheck "${shell_scripts[@]}"
            for script in "${shell_scripts[@]}"; do
              bash -n "${script}"
            done
          fi

      - name: Install service dependencies
        run: |
          set -euo pipefail
          for dir in \
            services/api-gateway \
            services/auth-service \
            services/wallet-service \
            services/transaction-service \
            services/notification-service \
            services/frontend; do
            npm --prefix "${dir}" ci
          done

      - name: Validate Node service syntax
        run: |
          set -euo pipefail
          for entrypoint in \
            services/api-gateway/server.js \
            services/auth-service/server.js \
            services/wallet-service/server.js \
            services/transaction-service/server.js \
            services/notification-service/server.js; do
            node --check "${entrypoint}"
          done

      - name: Build frontend
        run: npm --prefix services/frontend run build

      - name: Lint YAML files
        env:
          DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          yaml_files=()
          if [ -n "${DIFF_BASE:-}" ] && git rev-parse --verify "${DIFF_BASE}^{commit}" >/dev/null 2>&1; then
            mapfile -t yaml_files < <(
              git diff --name-only "${DIFF_BASE}" "${DIFF_HEAD}" -- \
                '.github/workflows/*.yml' '.github/workflows/*.yaml' \
                'k8s/**/*.yml' 'k8s/**/*.yaml' \
                'scripts/**/*.yml' 'scripts/**/*.yaml' | sort -u
            )
          fi
          if [ "${#yaml_files[@]}" -gt 0 ]; then
            python -m yamllint -c .yamllint.yml -s "${yaml_files[@]}"
          fi

      - name: Render Kubernetes manifests
        run: |
          set -euo pipefail
          kubectl kustomize k8s/base >/tmp/swiftpay-base.yaml
          kubectl kustomize k8s/overlays/dev >/tmp/swiftpay-dev.yaml
          kubectl kustomize k8s/overlays/prod >/tmp/swiftpay-prod.yaml

      - name: Validate manifest document structure
        run: |
          set -euo pipefail
          python - <<'PY'
          import yaml

          files = [
              "/tmp/swiftpay-base.yaml",
              "/tmp/swiftpay-dev.yaml",
              "/tmp/swiftpay-prod.yaml",
              "k8s/argocd/swiftpay-dev-application.yaml",
              "k8s/argocd/swiftpay-prod-application.yaml",
          ]

          for file_path in files:
              with open(file_path, "r", encoding="utf-8") as handle:
                  docs = [doc for doc in yaml.safe_load_all(handle) if doc is not None]
              if not docs:
                  raise SystemExit(f"{file_path}: no YAML documents found")
              for index, doc in enumerate(docs, start=1):
                  if not isinstance(doc, dict):
                      raise SystemExit(f"{file_path}: document {index} is not a YAML object")
                  if not doc.get("apiVersion") or not doc.get("kind"):
                      raise SystemExit(f"{file_path}: document {index} is missing apiVersion or kind")
                  metadata = doc.get("metadata")
                  if not isinstance(metadata, dict) or not metadata.get("name"):
                      raise SystemExit(f"{file_path}: document {index} is missing metadata.name")

          print(f"Validated {len(files)} manifest files")
          PY

      - name: Summarize validation coverage
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Validation Coverage

          - GitHub Actions workflow linting via `actionlint`
          - Shell script linting via `shellcheck` and `bash -n`
          - Dependency installation checks for all services
          - Node syntax validation for backend service entrypoints
          - Frontend production build validation
          - YAML linting via `yamllint`
          - `kubectl kustomize` render checks for base, dev, and prod overlays
          - Offline YAML document checks for rendered overlays and ArgoCD application manifests
          EOF
