apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: swiftpay-dev

resources:
  - ../../base
  - vault-serviceaccount.yaml
  - vault-secret-store.yaml
  - vault-external-secrets.yaml
  - infra/postgres.yaml
  - infra/redis.yaml
  - infra/rabbitmq.yaml
  - state-backup.yaml
  - ingress-traefik.yaml
  - supplemental-networkpolicy.yaml

patchesStrategicMerge:
  - dev-config-patch.yaml
  - dev-env-patch.yaml
  - dev-probe-delays-patch.yaml
  - dev-pull-policy-patch.yaml
  - dev-scale-patch.yaml
  - dev-hpa-patch.yaml
  - dev-pdb-patch.yaml
  - dev-quota-patch.yaml
  - dev-cronjob-patch.yaml
  - dev-db-migration-patch.yaml
  - dev-resource-requests-patch.yaml
  - dev-rollout-strategy-patch.yaml

labels:
  - pairs:
      cloud-provider: local
      cluster: k3s
      environment: dev
    includeSelectors: false

images:
  - name: veeno/api-gateway
    newName: swiftpay-api-gateway
    newTag: dev
  - name: veeno/auth-service
    newName: swiftpay-auth-service
    newTag: dev
  - name: veeno/frontend
    newName: swiftpay-frontend
    newTag: dev
  - name: veeno/notification-service
    newName: swiftpay-notification-service
    newTag: dev
  - name: veeno/transaction-service
    newName: swiftpay-transaction-service
    newTag: dev
  - name: veeno/wallet-service
    newName: swiftpay-wallet-service
    newTag: dev
